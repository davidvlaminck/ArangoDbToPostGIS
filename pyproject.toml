[project]
name = "arangodbtopostgis"
version = "0.1.0"
description = "Copy data from ArangoDB to PostGIS"
requires-python = ">=3.13"
dependencies = [
    "psycopg[binary]",
    "python-arango",
    "tqdm",
]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
]
ignore = [
    "E501",  # line length handled by formatter
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]  # assert allowed in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["arango.*", "psycopg.*", "tqdm"]
ignore_missing_imports = true
